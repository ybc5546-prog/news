<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ערוץ 14 - נגן מבודד</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background-color: #000; overflow: hidden; }
        
        /* מיכל שחוסם אינטראקציה עם כפתורי יוטיוב מיותרים */
        .video-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            top: -60px; /* מסתיר את כותרת הסרטון של יוטיוב */
            left: 0;
            width: 100%;
            height: calc(100% + 120px); /* מפצה על ההסתרה מלמעלה ומלמטה */
            border: 0;
        }

        /* שכבה שקופה למעלה כדי למנוע לחיצה על הקישורים של יוטיוב */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            z-index: 10;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <div class="overlay"></div>
        <iframe 
            src="https://www.youtube.com/embed/Cg2wuRk-Aoo?autoplay=1&controls=1&showinfo=0&rel=0&modestbranding=1&iv_load_policy=3" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
