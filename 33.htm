<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>ערוץ 14 - שידור חי</title>
    <style>
        /* הגדרות לתצוגה נקייה על כל המסך ללא רקע ושוליים */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            background: #000; 
            overflow: hidden; 
        }
        /* הנגן תופס את כל שטח הדף */
        iframe { 
            width: 100%; 
            height: 100%; 
            border: 0; 
        }
    </style>
</head>
<body>
    <iframe 
        src="https://www.youtube.com/embed/Cg2wuRk-Aoo?autoplay=1&rel=0" 
        allow="autoplay; encrypted-media; fullscreen" 
        allowfullscreen>
    </iframe>
</body>
</html>
