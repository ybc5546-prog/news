<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ערוץ 14 - שידור חי</title>
    <style>
        /* הגדרות להפיכת הדף לריק ונקי לגמרי */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            background-color: #000; /* רקע שחור נקי */
            overflow: hidden; /* מניעת פסי גלילה */
        }
        /* הנגן המוטמע תופס את כל המסך */
        iframe { 
            width: 100%; 
            height: 100%; 
            border: 0; 
        }
    </style>
</head>
<body>
    <iframe 
        src="https://www.youtube.com/embed/Cg2wuRk-Aoo?autoplay=1&rel=0&modestbranding=1" 
        allow="autoplay; encrypted-media; fullscreen" 
        allowfullscreen>
    </iframe>
</body>
</html>
